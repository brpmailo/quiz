  }

    display: flex;
    flex-direction: column;

  }

  .question-card {
    background: #ffffffdd;
    backdrop-filter: blur(4px);

let currentQuestions = [];
let selectedAnswers = [];
let timerInterval = null;

function getRandomQuestions(arr, num) {
  const shuffled = [...arr];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.slice(0, num);
}

function startQuiz() {
  document.getElementById("startContainer").style.display = "none";
  document.getElementById("quizContainer").style.display = "block";
  document.getElementById("resultContainer").style.display = "none";
  if (timerInterval) clearInterval(timerInterval);
  
  currentQuestions = getRandomQuestions(allQuestions, 50);
  selectedAnswers = new Array(currentQuestions.length).fill(null);
  renderQuestions();
  startTimer(900); // 15 minutes
}

function renderQuestions() {
  const container = document.getElementById("questionsContainer");
  container.innerHTML = "";
  
  currentQuestions.forEach((q, idx) => {
    const card = document.createElement("div");
    card.className = "question-card";
    const qDiv = document.createElement("div");
    qDiv.className = "question-text";
    qDiv.innerHTML = `<span style="background:#ff9800; color:white; border-radius:30px; padding:2px 12px; margin-right:12px;">${idx+1}</span> ${q.question}`;
    card.appendChild(qDiv);
    
    const optionsDiv = document.createElement("div");
    optionsDiv.className = "options-grid";
    
    q.options.forEach((opt, optIndex) => {
      const letter = String.fromCharCode(65 + optIndex); // A, B, C, D
      const displayText = `${letter}. ${opt}`;
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerHTML = `<span style="font-weight:800; margin-right:8px;">${letter}</span> ${opt}`;
      btn.setAttribute("data-opt-value", opt);  // original answer string
      
      btn.addEventListener("click", () => {
        if (selectedAnswers[idx] !== null) return; // already answered
        const originalValue = btn.getAttribute("data-opt-value");
        selectedAnswers[idx] = originalValue;
        // clear previous styles in this question group
        const allBtns = optionsDiv.querySelectorAll(".option-btn");
        allBtns.forEach(b => {
          b.classList.remove("selected", "correct", "wrong");
        });
        btn.classList.add("selected");
        if (originalValue === q.answer) {
          btn.classList.add("correct");
        } else {
          btn.classList.add("wrong");
        }
      });
      optionsDiv.appendChild(btn);
    });
    card.appendChild(optionsDiv);
    container.appendChild(card);
  });
  
  const finishDiv = document.getElementById("finishBtnContainer");
  finishDiv.innerHTML = "";
  const finishBtn = document.createElement("button");
  finishBtn.innerHTML = "<i class='fas fa-check-circle'></i> Finish Quiz & Get Certificate 🏆";
  finishBtn.onclick = finishQuiz;
  finishDiv.appendChild(finishBtn);
}

function startTimer(seconds) {
  const timerEl = document.getElementById("timer");
  let timeLeft = seconds;
  timerInterval = setInterval(() => {
    const mins = Math.floor(timeLeft / 60);
    const secs = timeLeft % 60;
    timerEl.innerHTML = `⏱️ Time Left: ${mins}:${secs < 10 ? "0" : ""}${secs}`;
    timeLeft--;
    if (timeLeft < 0) {
      clearInterval(timerInterval);
      finishQuiz();
    }
  }, 1000);
}

function finishQuiz() {
  if (timerInterval) clearInterval(timerInterval);
  document.getElementById("quizContainer").style.display = "none";
  const resultDiv = document.getElementById("resultContainer");
  resultDiv.style.display = "block";
  
  let correctCount = 0;
  let attemptedCount = 0;
  for (let i = 0; i < currentQuestions.length; i++) {
    const userAns = selectedAnswers[i];
    if (userAns !== null) {
      attemptedCount++;
      if (userAns === currentQuestions[i].answer) correctCount++;
    }
  }
  const wrongCount = attemptedCount - correctCount;
  const totalQ = currentQuestions.length;
  const percentRaw = (correctCount / totalQ) * 100;
  const percent = percentRaw.toFixed(1);
  let scoreValue = (correctCount * 2) - wrongCount;
  if (scoreValue < 0) scoreValue = 0;
  
  // achievement title based on percent
  let achievementTitle = "";
  let medalIcon = "🎓";
  if (percent >= 90) { achievementTitle = "GRAND MASTER OF KNOWLEDGE"; medalIcon = "🏆🌟"; }
  else if (percent >= 75) { achievementTitle = "DISTINCTION SCHOLAR"; medalIcon = "🥇✨"; }
  else if (percent >= 55) { achievementTitle = "MERIT ACHIEVER"; medalIcon = "🏅📘"; }
  else if (percent >= 35) { achievementTitle = "CERTIFICATE OF PARTICIPATION"; medalIcon = "📜🌱"; }
  else { achievementTitle = "BRAVE LEARNER"; medalIcon = "💪🌟"; }
  
  const currentDate = new Date().toLocaleDateString('en-GB', { year:'numeric', month:'long', day:'numeric' });
  
  // beautiful certificate HTML
  const certificateHTML = `
    <div class="certificate-wrapper">
      <div class="certificate">
        <i class="fas fa-award" style="font-size: 48px; color: #e4b363;"></i>
        <h1>🎉 CERTIFICATE OF EXCELLENCE 🎉</h1>
        <div class="sub">Official Achievement Recognition</div>
        <div class="recipient"><i class="fas fa-user-graduate"></i> Quiz Champion</div>
        <div class="achievement-level">${medalIcon}  ${achievementTitle}  ${medalIcon}</div>
        <p style="font-size:1rem; color:#6b4c2c;">In recognition of outstanding performance in the Advanced General Knowledge Quiz</p>
        
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-number">${correctCount}/${totalQ}</div><div class="stat-label">CORRECT ANSWERS</div></div>
          <div class="stat-card"><div class="stat-number">${percent}%</div><div class="stat-label">ACCURACY SCORE</div></div>
          <div class="stat-card"><div class="stat-number">${attemptedCount}</div><div class="stat-label">ATTEMPTED</div></div>
          <div class="stat-card"><div class="stat-number">${scoreValue}</div><div class="stat-label">TOTAL POINTS</div></div>
        </div>
        
        <div class="percentage-circle">
          <i class="fas fa-chart-line"></i> ${percent}% Mastery
        </div>
        
        <p style="margin: 10px 0 0; font-style:italic;">"${percent >= 75 ? 'Exceptional intellect & sharp memory!' : (percent >= 50 ? 'Great effort! Keep climbing 🚀' : 'Every quiz sharpens the mind. Try again to conquer!')}"</p>
        
        <div class="signature">
          <div><i class="fas fa-stamp"></i> <span class="sign-line">Brp Digital Institute</span><br>📅 ${currentDate}</div>
          <div><i class="fas fa-certificate"></i> <span class="sign-line">Verification Code: QZ-${Math.floor(Math.random()*9000+1000)}</span></div>
        </div>
        <button class="restart-btn" onclick="location.reload();"><i class="fas fa-sync-alt"></i> Play Again & Earn New Certificate</button>
      </div>
    </div>
  `;
  
  resultDiv.innerHTML = certificateHTML;
}

// Ensure that if any error, but everything stable.
window.onload = () => {
  document.getElementById("startContainer").style.display = "block";
  document.getElementById("quizContainer").style.display = "none";
  document.getElementById("resultContainer").style.display = "none";
};
</script>
<footer style="text-align:center; font-size:12px; margin-top:15px;">✨ BRP DIGITAL INSTITUTE • KNOWLEDGE EMPOWERS ✨</footer>
</body>
</html>
